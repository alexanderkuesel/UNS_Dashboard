# One data source per database. To add another schema/database, copy the
# block with a new name + uid; the dashboards' "Data source" picker then
# switches between them (each database needs the uns layer installed).
apiVersion: 1

datasources:
  - name: UNS Historian
    uid: uns-historian
    type: grafana-postgresql-datasource
    url: ${UNS_PG_HOST}:${UNS_PG_PORT}
    user: ${UNS_PG_USER}
    isDefault: true
    editable: false
    jsonData:
      database: ${UNS_PG_DB}
      sslmode: ${UNS_PG_SSLMODE}
      postgresVersion: 1700
      timescaledb: true
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
    secureJsonData:
      password: ${UNS_PG_PASSWORD}
